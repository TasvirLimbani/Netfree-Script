name: Netfree Auto-Poster

on:
  schedule:
    - cron: '0 * * * *'  # Runs every 1 hour
  workflow_dispatch:     # Allows manual trigger from the Actions tab

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run poster script
        run: python netfree.py

      - name: Commit and push updated posted movies log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update posted_movies.txt [skip ci]"
          file_pattern: posted_movies.txt
